name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test

  build:
    name: Build and release gates
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run check:bundle
      - run: node scripts/release-check.mjs --release-version "$(node -p \"require('./package.json').version\")" --channel stable --manifest /tmp/release-manifest.json
      - run: pnpm run release:pack
      - run: pnpm run release:smoke
      - run: pnpm --filter @streetui/renderer exec vitest run src/a11y.test.ts
      - run: pnpm --filter @streetui/testing exec vitest run src/a11y-regression.test.ts
      - run: pnpm exec eslint packages apps examples
