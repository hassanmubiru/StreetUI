<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreetUI Showcase</title>
    <style>
      :root { color-scheme: light; --ink:#12151c; --muted:#5b6472; --line:#e4e7ec; --accent:#2f5bd7; --bg:#f7f8fa; }
      * { box-sizing: border-box; }
      body { margin:0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
      #app { max-width: 760px; margin: 0 auto; padding: 24px; }
      section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
      #navbar { display:flex; gap:16px; align-items:baseline; }
      #navbar h1 { font-size:18px; margin:0 auto 0 0; }
      #hero h1 { font-size:28px; margin:.2em 0; }
      h2 { font-size:19px; margin:.1em 0 .5em; }
      h3 { font-size:15px; margin:.4em 0 .2em; }
      a { color:var(--accent); text-decoration:none; margin-right:4px; }
      button { font:inherit; padding:7px 13px; margin:4px 6px 0 0; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
      button:hover { border-color:var(--accent); color:var(--accent); }
      #hero-cta, #btn-submit { background:var(--accent); color:#fff; border-color:var(--accent); }
      input { display:block; width:100%; padding:8px 10px; margin:6px 0; border:1px solid var(--line); border-radius:8px; font:inherit; }
      #counter-value { font-size:34px; font-weight:700; display:block; margin:6px 0; }
      #features-list span, #details-region span { display:inline-block; padding:6px 10px; margin:4px 6px 0 0; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
      #feature-count, #form-validation, #form-submitted, #event-readout { color:var(--muted); }
      #site-footer { color:var(--muted); text-align:center; background:transparent; border:none; }
    </style>
  </head>
  <body>
    <!-- StreetUI mounts the entire application into this container. -->
    <div id="app"></div>
    <!-- Build first: `pnpm --filter @streetui/example-showcase build` (outputs dist/index.js) -->
    <script type="module" src="./dist/index.js"></script>
  </body>
</html>
